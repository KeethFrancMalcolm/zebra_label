<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLabel Pro</title>
    <style>
        :root {
            --primary: #00897b; /* Professional Teal */
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2d3436;
        }

        /* --- UI STYLES (Screen Only) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            max-width: 400px;
            width: 100%;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 25px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; color: var(--primary); text-align: center; font-size: 22px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #555; }
        
        input[type="text"], input[type="number"], input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        input:focus { border-color: var(--primary); outline: none; }

        /* Time Controls */
        .time-controls {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            justify-content: space-between;
        }
        .time-btn {
            flex: 1;
            padding: 8px 0;
            background: #e0f2f1;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-btn:hover { background: var(--primary); color: white; }
        .time-btn.now { background: var(--primary); color: white; }

        /* Custom Checkbox Design */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkbox-wrapper:hover { background: #eee; }
        .checkbox-wrapper input { margin-right: 12px; transform: scale(1.2); accent-color: var(--primary); }
        .checkbox-wrapper span { font-size: 15px; font-weight: 500; }

        .btn-print {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,137,123, 0.3);
        }
        .btn-print:active { transform: scale(0.98); }

        /* Footer Style */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #888;
            font-weight: 500;
        }

        /* PREVIEW AREA (Screen) */
        .preview-box {
            margin-top: 25px;
            border-top: 2px dashed #eee;
            padding-top: 20px;
            text-align: center;
        }
        .preview-label {
            width: 50mm;
            height: 25mm;
            background: white;
            border: 1px solid #333;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 1mm 2mm 3mm 2mm;
            box-sizing: border-box;
            text-align: left;
        }

        /* --- PRINT STYLES (The Engine) --- */
        @media print {
            @page {
                size: 50mm 25mm landscape;
                margin: 0;
            }
            body { 
                background: white; 
                margin: 0; padding: 0; 
                display: block;
            }
            .app-container { display: none; } /* Hide UI & Footer */
            
            #print-queue {
                display: block !important;
            }

            .print-sticker {
                width: 50mm;
                height: 25mm;
                page-break-after: always;
                break-after: page;
                position: relative;
                overflow: hidden;
                box-sizing: border-box;
                padding: 1mm 2mm 3mm 2mm;
                display: flex;
                flex-direction: column;
            }

            /* Rotation Fix Class */
            .force-rotate {
                transform: rotate(90deg);
                transform-origin: center;
                width: 25mm;
                height: 50mm;
                position: absolute;
                top: -12.5mm;
                left: 12.5mm;
            }
        }

        /* --- Final Label Typography --- */
        .lbl-name { font-size: 14pt; font-weight: 900; line-height: 1.1; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lbl-reg { font-size: 10pt; font-weight: bold; margin-top: 1mm; }
        .lbl-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; }
        .lbl-meta { font-size: 8pt; font-family: monospace; font-weight: 600; }
        .lbl-ward { font-size: 9pt; font-weight: bold; border: 1px solid #000; padding: 1px 4px; white-space: nowrap; }
        .lbl-test { font-size: 9pt; font-weight: bold; margin-top: 1mm; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

    </style>
</head>
<body>

    <div class="app-container">
        <h2>🏥 MediLabel Pro</h2>

        <div class="input-group">
            <label>Patient Name</label>
            <input type="text" id="pName" placeholder="e.g. Mrs. B.B.M. Izzadeen" oninput="updateState()">
        </div>

        <div class="input-group">
            <label>Registration No (BHT)</label>
            <input type="text" id="pReg" placeholder="e.g. 9962254879" oninput="updateState()">
        </div>

        <div class="form-grid">
            <div class="input-group">
                <label>Time</label>
                <input type="time" id="pTime" oninput="updateState()">
                <div class="time-controls">
                    <button class="time-btn" onclick="adjustTime(-60)">-1h</button>
                    <button class="time-btn" onclick="adjustTime(-5)">-5m</button>
                    <button class="time-btn now" onclick="setNow()">NOW</button>
                    <button class="time-btn" onclick="adjustTime(5)">+5m</button>
                </div>
            </div>
             <div class="input-group">
                <label>Copies</label>
                <input type="number" id="pCopies" value="1" min="1" max="50">
            </div>
        </div>

        <div class="checkbox-group">
            <div class="checkbox-wrapper" onclick="toggleCheckbox('chkWard')">
                <input type="checkbox" id="chkWard" onchange="updateState()">
                <span>Include "Ward 4C"</span>
            </div>

            <div class="checkbox-wrapper" onclick="toggleCheckbox('chkTest')">
                <input type="checkbox" id="chkTest" onchange="toggleTestField()">
                <span>Include Test Name</span>
            </div>
        </div>
        
        <div class="input-group" id="testFieldGroup" style="display:none;">
            <input type="text" id="pTest" placeholder="Enter Test Name (e.g. HIV HEP B)" oninput="updateState()">
        </div>

        <div class="checkbox-wrapper" style="background: #ffeaea; border: 1px solid #ffcccc;" onclick="toggleCheckbox('chkRotate')">
            <input type="checkbox" id="chkRotate">
            <span style="color: #d63031; font-weight: 600;">Fix Rotation (If printing sideways)</span>
        </div>

        <button class="btn-print" onclick="preparePrint()">PRINT LABELS</button>

        <div class="preview-box">
            <label style="margin-bottom: 10px;">Live Preview</label>
            <div class="preview-label" id="previewCanvas">
                </div>
        </div>

        <div class="footer">
            Made with 🤍 by Keeth
        </div>
    </div>

    <div id="print-queue" style="display:none;"></div>

    <script>
        // --- TIME FUNCTIONS ---
        function setNow() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('pTime').value = timeStr;
            updateState();
        }

        function adjustTime(minutes) {
            const timeInput = document.getElementById('pTime');
            if(!timeInput.value) {
                setNow();
                return;
            }
            
            // Parse current value
            const [h, m] = timeInput.value.split(':').map(Number);
            const date = new Date();
            date.setHours(h);
            date.setMinutes(m + minutes); // Add/Subtract minutes

            // Format back to HH:MM
            const newTimeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
            timeInput.value = newTimeStr;
            updateState();
        }

        // Initialize Time on Load
        const now = new Date();
        const dateStr = now.getDate().toString().padStart(2, '0') + '/' + (now.getMonth()+1).toString().padStart(2, '0');
        setNow();

        // --- UI FUNCTIONS ---
        function toggleCheckbox(id) {
            const el = document.getElementById(id);
            if (event.target !== el && event.target.tagName !== 'INPUT' && event.target.tagName !== 'BUTTON') {
                el.checked = !el.checked;
                if(id === 'chkTest') toggleTestField();
                updateState();
            }
        }

        function toggleTestField() {
            const isChecked = document.getElementById('chkTest').checked;
            document.getElementById('testFieldGroup').style.display = isChecked ? 'block' : 'none';
            updateState();
        }

        function getLabelHTML(name, reg, ward, test, time, isRotate) {
            let html = `
                <div class="lbl-name">${name || 'Patient Name'}</div>
                <div class="lbl-reg">Reg: ${reg || '---'}</div>
            `;

            if (test) {
                html += `<div class="lbl-test">${test}</div>`;
            }

            html += `<div class="lbl-row">
                        <div class="lbl-meta">${dateStr} &nbsp;${time}</div>`;
            
            if (ward) {
                html += `<div class="lbl-ward">Ward 4C</div>`;
            }
            
            html += `</div>`;
            return html;
        }

        function updateState() {
            const name = document.getElementById('pName').value;
            const reg = document.getElementById('pReg').value;
            const time = document.getElementById('pTime').value;
            const showWard = document.getElementById('chkWard').checked;
            const showTest = document.getElementById('chkTest').checked;
            const testName = showTest ? document.getElementById('pTest').value : null;

            // Update Preview
            const canvas = document.getElementById('previewCanvas');
            canvas.innerHTML = getLabelHTML(name, reg, showWard, testName, time, false);
        }

        function preparePrint() {
            const name = document.getElementById('pName').value;
            const reg = document.getElementById('pReg').value;
            const time = document.getElementById('pTime').value;
            const showWard = document.getElementById('chkWard').checked;
            const showTest = document.getElementById('chkTest').checked;
            const testName = showTest ? document.getElementById('pTest').value : null;
            const copies = parseInt(document.getElementById('pCopies').value) || 1;
            const needsRotation = document.getElementById('chkRotate').checked;

            const queue = document.getElementById('print-queue');
            queue.innerHTML = ''; 

            for (let i = 0; i < copies; i++) {
                const sticker = document.createElement('div');
                sticker.className = 'print-sticker';
                if (needsRotation) sticker.classList.add('force-rotate');
                sticker.innerHTML = getLabelHTML(name, reg, showWard, testName, time, needsRotation);
                queue.appendChild(sticker);
            }

            window.print();
        }

        // Init
        updateState();
    </script>
</body>
</html>
